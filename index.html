<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06090c"><title>BARCODE ARENA 182</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="save.css"></head><body><main class="wrap">
<h1>BARCODE ARENA</h1><p class="sub">182 MONSTERS / FINAL EDITION</p>
<nav class="tabs"><button data-page="summon" class="primary">召喚</button><button data-page="battle">対戦</button><button data-page="dex">図鑑</button><button data-page="codes">帳面</button></nav>
<section id="summon" class="page active"><div class="panel"><h2>バーコード召喚</h2><div class="row"><button id="cameraBtn" class="primary">カメラで読む</button><button id="stopCamera">停止</button></div><video id="camera" class="camera" playsinline muted></video><p id="cameraStatus" class="status">カメラが使えない場合は数字を入力できます。</p><div class="row"><input id="code" inputmode="numeric" autocomplete="off" placeholder="JAN / EAN または4桁以上"><button id="summonBtn" class="primary">ピッ！召喚</button></div><p class="notice">初めて読むバーコードだけ抽選。同じ端末では次回から同じモンスターが出ます。特殊枠は、ローブ姿りゅうおう 1/16384、真の姿りゅうおう 1/65536、ユウシヤ 1/32768。</p></div><div class="panel"><div id="result" class="status">バーコードを読んで召喚してください。</div></div></section>
<section id="battle" class="page"><div class="panel"><h2>1対1バトル</h2><p class="status">最後に召喚したモンスターで戦います。</p><div id="battlefield" class="battlefield"></div><div class="row"><button id="attackBtn" class="danger">たたかう</button><button id="skillBtn" class="primary">必殺技</button><button id="newEnemyBtn">相手を変える</button></div><div id="battleLog" class="log">モンスターを召喚してください。</div></div></section>
<section id="dex" class="page"><div class="panel"><h2>発見図鑑 <span id="count">0 / 182</span></h2><div class="row"><select id="filter"><option value="all">すべて</option><option value="found">発見済み</option><option value="missing">未発見</option></select><button id="resetDex">図鑑を消去</button></div></div><div id="book" class="grid"></div></section>
<section id="codes" class="page"><div class="panel"><h2>バーコード帳 <span id="codeCount">0件</span></h2><p class="status">召喚したバーコードとモンスターの対応を記録します。商品名などをメモできます。</p><div class="row"><input id="codeSearch" placeholder="バーコード・名前・メモを検索"><button id="exportCodes">帳面を保存</button></div></div><div id="codeBook" class="code-book"></div></section>
</main><script src="base-characters.js"></script><script src="extras.js"></script><script src="app.js"></script></body></html>
